method: searched
source: >-
  https://hergertsynthora.com/muestras/ (free samples + pricing), https://api.hergertsynthora.com/llms.txt (free
  tier statement), https://catalog.hergertsynthora.com/catalog.json (features.free_trial, products[].free_trial_calls),
  the 402 bodies observed on notary.hergertsynthora.com/service (freeTier.callsPerWallet 3) and
  api.hergertsynthora.com/v1/wallet-enrich (freeTier.callsPerWallet 1), and the x-free-tier response header.
description: >-
  There is no sandbox environment, no test mode and no test keys: the mesh is wallet-native and the "sandbox" is
  a free tier keyed on the caller's real Base wallet address, plus downloadable signed sample reports and a
  free dataset sample. No test values are invented here; every number below is published by the provider.
modes:
  test_vs_live: none - a single production surface; the only distinction is free-tier vs paid calls
  free_tier:
    mechanism: 'send header X-WALLET: 0x<your Base address> (no payment)'
    published_limits:
    - 'api.hergertsynthora.com/llms.txt: "Free tier: 1 llamada por wallet (+3/dia/IP) en productos de datos"'
    - 'catalog.json features.free_trial: "3 free calls per Base wallet"; products[].free_trial_calls: 3'
    - 'notary 402 body freeTier: {callsPerWallet: 3, header: X-WALLET}; response header x-free-tier: 3'
    - 'api gateway 402 body (wallet-enrich) freeTier: {callsPerWallet: 1, header: X-WALLET}; response header x-free-tier: 1'
    note: The published free-tier count differs by product (1 on the gateway product probed, 3 on the notary and in the catalog); read x-free-tier on the 402 for the live value.
  preflight:
    operationId: payToPreflight
    path: POST /preflight (pay.hergertsynthora.com)
    price_usdc: '0.010'
    purpose: '"Verify-before-pay check on any x402 endpoint" - the closest thing to a dry run: validate a payTo/resource before committing funds.'
    source: openapi/hergertsynthora-com-mesh-aggregate-openapi.yml
