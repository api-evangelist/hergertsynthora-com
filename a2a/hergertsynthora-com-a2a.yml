    ERC-8004 identity is inconsistent across the provider's own documents: metadata.erc8004.agentIds lists
    56572 and 56577 (and disowns 61548), while agent-registration.json and the homepage cite agentId 84581 on
    the same registry. Recorded as observed; not resolved here.
