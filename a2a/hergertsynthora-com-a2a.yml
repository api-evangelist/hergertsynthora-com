    vocabulary (supportedInterfaces[].protocolBinding) consistently.
  - securitySchemes.x402 is declared as type http with scheme "x402", which is not an IANA-registered HTTP
    authentication scheme; the live 402 does carry a WWW-Authenticate x402 challenge on the api gateway, so the
