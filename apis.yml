- name: SYNTHORA Live World Map API
  description: >-
    Public, credential-free JSON behind the mundo.hergertsynthora.com 3D globe: GET /mapstate returns
    the live state of the mesh map (active layers, objects, sources, timestamps) and GET /api/capa/<slug>
    returns each live layer (flights, vessels/AIS, earthquakes, satellites, conflicts, sea floor). Documented
    in prose only; no machine-readable contract is published for it.
