aid: hergertsynthora-com
name: Hergert Synthora
description: 'HERGERT SYNTHORA S.L. is a Las Palmas de Gran Canaria (Spain) company that operates SYNTHORA, an autonomous
  agent mesh selling machine-payable intelligence: 121 pay-per-call verdict products (sanctions and AML screening,
  wallet and transaction risk, Polymarket and prediction-market signals, maritime AIS, DeFi, macro and OSINT data),
  an Agent Notary, a 30-tool hosted MCP server and a signed A2A agent card, all settled per call in USDC on Base
  over the x402 protocol with Ed25519-signed receipts, an ERC-8004 on-chain identity and no accounts or API keys.'
