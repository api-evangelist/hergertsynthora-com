    a SHA-256 (content never stored) and receive an Ed25519-signed receipt anyone can verify later. 0.002 USDC per
    call via x402 on Base, first three calls free per wallet; exposed as REST, A2A JSON-RPC and a one-tool MCP server
    on the same host.'
