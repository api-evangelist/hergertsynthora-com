overlay: 1.0.0
info:
  title: API Evangelist overlay for the SYNTHORA Machine-Payable API Mesh (aggregate) OpenAPI
  version: '2026-09-19'
  description: 'Non-destructive enhancements API Evangelist applies on top of the provider-published spec (openapi/hergertsynthora-com-mesh-aggregate-openapi.yml,
    fetched verbatim from https://api.hergertsynthora.com/openapi.json on 2026-09-19). The original is never mutated.
    Actions: declare the 20 tags the operations use but the spec does not declare (only safety and discovery are
    declared); add termsOfService from the info.x-terms extension the spec already carries; add externalDocs to
    llms.txt; record where the per-service OpenAPIs live.'
extends: hergertsynthora-com-mesh-aggregate-openapi.yml
actions:
- target: $.info
  update:
    termsOfService: https://hergertsynthora.com/terms/
    x-apievangelist:
      profile: https://github.com/api-evangelist/hergertsynthora-com
      generated: '2026-09-19'
      method: searched
      source: https://api.hergertsynthora.com/openapi.json
      sla: https://api.hergertsynthora.com/sla/
      per_service_openapis: openapi/services/ (59 saved verbatim; 53 product hosts return 404 on /openapi.json;
        9 hosts mirror this aggregate)
- target: $.info.description
  description: Point readers at the llms.txt the provider maintains for the api host.
  update: ' Agent guide: https://api.hergertsynthora.com/llms.txt'
