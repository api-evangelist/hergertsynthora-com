domain_standards_summary: >-
  For a machine-payable intelligence mesh the market standards are x402 v2, A2A, MCP and ERC-8004, and the
  contract DECLARES all four (x402 in every operation's x-payment-info and securitySchemes; A2A and x402
  discovery as operations in the spec itself; MCP and ERC-8004 in the registration file the apex serves).
  No sector regulatory schema (FHIR, PSD2, SCIM, OData) applies to this provider and none is claimed.
