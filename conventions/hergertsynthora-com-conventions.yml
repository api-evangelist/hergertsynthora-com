  supported: false
request_tracing:
  request_id_header: none observed
  receipt: >-
    Every paid 200 carries a receipt object (Ed25519 signature over result plus the payment reference); the
    x402 settlement transaction hash on Base is the invoice and the trace (terms section 2 and 7).
  signature_verification: >-
    Recanonicalise the signed field with json.dumps(sort_keys=True, separators=(',',':')) and verify receipt.sig
    with the Ed25519 key at https://api.hergertsynthora.com/pubkey or the JWKS (kid synthora-mesh-attest).
