description: >-
  Cross-cutting runtime semantics of the SYNTHORA machine-payable API mesh: one request shape (POST /service
  with a JSON body) repeated across 121 product hosts and a /v1/{id} gateway, paid per call over x402, with
  every result Ed25519-signed. Cross-links errors/, lifecycle/, authentication/, rate-limits/ and plans/.
base_urls:
  gateway: https://api.hergertsynthora.com/v1/{id}
  per_product: https://<product>.hergertsynthora.com/service
  aggregate_servers: https://pay.hergertsynthora.com (as declared in the aggregate OpenAPI)
  notary: https://notary.hergertsynthora.com/service
  public_map: https://mundo.hergertsynthora.com (/mapstate, /api/capa/<slug>)
api_style: JSON over HTTPS; a single POST per product; JSON-RPC 2.0 for A2A and MCP
authentication:
  style: wallet-native x402 micropayment; no accounts, no API keys, no sign-up
  paid_call: X-PAYMENT header carrying an EIP-3009 transferWithAuthorization payload (USDC on Base), obtained by reading the 402 challenge
  free_tier: 'X-WALLET: 0x<Base address> header (identifies the wallet for the free trial and receipt attribution)'
  core_endpoints: X-WALLET as an apiKey scheme on the "nucleo" state/meshgraph endpoints (403 without it)
  detail: authentication/hergertsynthora-com-authentication.yml
idempotency:
  supported: false
  coverage: none
  mechanism: null
  docs: null
  note: >-
    No Idempotency-Key or equivalent is documented anywhere. The surface is almost entirely read-only verdicts
    (all 30 MCP tools declare readOnlyHint true and idempotentHint true, which is a hint about semantics, not a
    replay-protection mechanism). The one state-creating write is the notary's op=notarize, which mints a new
    receipt per call; nothing documents de-duplication of a retried notarization. Payment replay is prevented
    by the x402/EIP-3009 authorization nonce, not by the API.
pagination:
  style: none
  note: Every operation returns a single verdict object; there are no list endpoints, cursors or page parameters in any of the 61 saved specs.
