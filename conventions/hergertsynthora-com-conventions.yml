  rfc9457: false
  shape: '402 -> x402 challenge object; 404 -> {"error": "..."}; JSON-RPC -> {jsonrpc, id, error{code,message,data?}}'
  detail: errors/hergertsynthora-com-problem-types.yml
rate_limits:
  signal_status: 402 (free tier exhausted -> payment required); no 429 documented
  headers_observed: [x-free-tier, payment-required, www-authenticate]
  published_limits: 'free tier 1 call per wallet (+3/day/IP) on data products (api llms.txt); 3 free calls per wallet (catalog, notary)'
  detail: rate-limits/hergertsynthora-com-rate-limits.yml
dry_run_mode:
  status: partial
  mechanism: 'POST /preflight (operationId payToPreflight, 0.010 USDC) - "Verify-before-pay check on any x402 endpoint"'
  note: A paid preflight that validates a payment target before committing funds; not a per-operation dry_run/simulate parameter on the verdict endpoints themselves.
reversibility:
  status: na
  note: >-
    The verdict surface is read-only: a paid call returns data and changes no state on the provider side, so
    there is nothing to reverse. The commercial act (the USDC settlement) is explicitly non-reversible: terms
    section 2 "A payment is non-refundable once the response has been delivered", with the one stated
    exception that an undeliverable result is never settled (SLA delivery_policy). The notary's op=notarize
    creates a permanent receipt by design (proof-of-existence); no revoke/void operation exists in the
    contract and none is documented, and no window is stated - an inherent property of a notary, recorded as
    na rather than none.
  write_surfaces:
  - operationId: trust_notary (op=notarize | execution | agreement)
    reversal_operation: none
    window: not stated
    docs: https://notary.hergertsynthora.com/llms.txt
  refunds:
    policy: none once delivered; not charged if not delivered
    docs: https://hergertsynthora.com/terms/
response_signing:
  algorithm: Ed25519 (EdDSA)
  key: https://api.hergertsynthora.com/.well-known/jwks.json (kid synthora-mesh-attest)
  canonicalization: 'JSON sort_keys + separators (",",":") ("jcs-lite-sortkeys")'
  applies_to: every paid result (receipt.sig), sample reports, the agent card (JWS)
cors:
  observed: 'access-control-allow-origin: *; access-control-allow-methods: GET, POST, OPTIONS; access-control-expose-headers: *'
localisation:
